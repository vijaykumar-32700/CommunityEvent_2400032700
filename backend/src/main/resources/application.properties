# Server Configuration
server.port=8080

# Application Name
spring.application.name=community-event-backend

# ================================================================
# PostgreSQL Database Configuration (pgAdmin)
# When running locally: connects to localhost PostgreSQL
# When running via Docker Compose: connects to 'postgres' service
# ================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/community_event_2400032700}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool Configuration
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

# ================================================================
# JPA / Hibernate Configuration
# ================================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ================================================================
# Swagger / OpenAPI Configuration
# Access Swagger UI at: http://localhost:8080/swagger-ui.html
# Access API Docs at:   http://localhost:8080/v3/api-docs
# ================================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.display-request-duration=true
