name: Build and Push Docker Images to Docker Hub

# ================================================================
# CI/CD Pipeline - Community Event Management System (project v1.1)
# Student: UMMADI VIJAY KUMAR | ID: 2400032700 | Section: S51
# Pushes backend + frontend Docker images to Docker Hub
# ================================================================

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & Publish Containers (Student ID 2400032700)
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Docker Buildx for multi-stage build support
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Authenticate with Docker Hub using repository secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 4: Build and Push Spring Boot Backend Image
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/docker-backend-2400032700:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/docker-backend-2400032700:${{ github.sha }}

      # Step 5: Build and Push React Frontend Image
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/docker-frontend-2400032700:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/docker-frontend-2400032700:${{ github.sha }}
